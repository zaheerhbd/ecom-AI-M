<div class="container-fluid px-4 mt-4">
    <div class="row">
        <section class="col-3 col-xl-2">
            <ng-container *ngIf="types && brands">
                <div class="filter-panel">
                <h6 class="filter-title">Sort</h6>
                <select class="custom-select custom-select-sm mb-3" (change)="onSortSelected($event.target.value)">
                    <option *ngFor="let sort of sortOptions" 
                        [selected]="shopParams.sort === sort.value"
                        [value]="sort.value">
                        {{sort.name}}
                    </option>
                </select>

                <h6 class="filter-title">Brands</h6>
                <ul class="list-group mb-3 brand-list">
                    <li class="list-group-item" *ngFor="let brand of brands"
                        [class.active]="brand.id === shopParams.brandId" [value]="brand.id"
                        (click)="onBrandSelected(brand.id)">
                        {{brand.name}}
                    </li>
                </ul>
                <h6 class="filter-title">Types</h6>
                <ul class="list-group">
                    <li class="list-group-item" *ngFor="let type of types"
                        [class.active]="type.id === shopParams.typeId" [value]="type.id"
                        (click)="onTypeSelected(type.id)">
                        {{type.name}}
                    </li>
                </ul>
                </div>
            </ng-container>
        </section>
        <section class="col-9 col-xl-10">
            <div class="d-flex justify-content-between align-items-center pb-2">
                <app-paging-header [totalCount]="totalCount" [pageNumber]="shopParams.pageNumber"
                    [pageSize]="shopParams.pageSize"></app-paging-header>

                <div class="form-inline mt-2" *ngIf="products">
                    <input (keyup.enter)="onSearch()" type="text" class="form-control mr-2" #search placeholder="Search">
                    <button (click)="onSearch()" class="btn btn-outline-primary my-2">Search</button>
                    <button (click)="onReset()" class="btn btn-outline-success ml-2 my-2">Reset</button>
                </div>
            </div>

            <div class="row">
                <div class="col-4 col-xl-3 mb-4" *ngFor="let product of products">
                    <app-product-item [product]="product"></app-product-item>
                </div>
            </div>
            <div class="d-flex justify-content-center mt-2 mb-5" *ngIf="totalCount > 0">
                <app-pager 
                    [pageSize]="shopParams.pageSize" 
                    [totalCount]="totalCount"
                    [pageNumber]="shopParams.pageNumber"
                    (pageChanged)="onPageChanged($event)"
                >
                </app-pager>
            </div>

        </section>
    </div>
</div>
